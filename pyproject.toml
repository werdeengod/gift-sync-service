[project]
name = "gift-sync-service"
version = "0.1.0"
description = ""
authors = [
    {name = "werdeengod",email = "azverev587@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "telethon (>=1.44.0,<2.0.0)",
    "fastapi (>=0.140.13,<0.141.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "uuid7-standard (>=1.1.0,<2.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "aio-pika (>=10.2.2,<11.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"

